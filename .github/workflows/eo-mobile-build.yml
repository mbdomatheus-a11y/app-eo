name: EO | Compilar app no GitHub

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Plataforma para gerar pre-visualizacao
        type: choice
        options:
          - android
          - ios
        required: true

permissions:
  contents: read

concurrency:
  group: eo-native-preview-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  build:
    name: Preview ${{ inputs.platform }}
    runs-on: ${{ inputs.platform == 'ios' && 'macos-15' || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java for Android
        if: inputs.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Expo native project
        env:
          CI: '1'
        run: npx expo prebuild --clean --platform ${{ inputs.platform }}

      - name: Compile Android preview APK
        if: inputs.platform == 'android'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Compile iOS Simulator app
        if: inputs.platform == 'ios'
        run: |
          workspace="$(find ios -maxdepth 2 -name '*.xcworkspace' -print -quit)"
          if [ -z "$workspace" ]; then
            echo "Expo did not generate the iOS workspace."
            exit 1
          fi
          scheme="$(xcodebuild -list -json -workspace "$workspace" | jq -r '.workspace.schemes[0]')"
          if [ -z "$scheme" ] || [ "$scheme" = "null" ]; then
            echo "Could not identify the app scheme."
            exit 1
          fi
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/eo-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            build
          app_path="$(find "$RUNNER_TEMP/eo-derived-data/Build/Products/Release-iphonesimulator" -maxdepth 2 -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "The iOS Simulator app was not found."
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$RUNNER_TEMP/eo-ios-simulator.zip"

      - name: Upload Android preview APK
        if: inputs.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: eo-android-preview-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 1

      - name: Upload iOS Simulator app
        if: inputs.platform == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: eo-ios-simulator-preview
          path: ${{ runner.temp }}/eo-ios-simulator.zip
          if-no-files-found: error
          retention-days: 1
