name: EO | Compilar app no GitHub

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Plataforma para gerar pre-visualizacao
        type: choice
        options:
          - android
          - ios
          - ios-testflight
        required: true

permissions:
  contents: read

jobs:
  android_preview:
    if: github.event_name == 'push' || inputs.platform == 'android'
    name: Preview Android
    concurrency:
      group: eo-native-preview-${{ github.ref }}-android
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Expo Android project
        env:
          CI: '1'
        run: npx expo prebuild --clean --platform android

      - name: Compile Android installable release APK with embedded JavaScript
        run: |
          cd android
          chmod +x gradlew
          ./gradlew \
            --no-daemon \
            --max-workers=2 \
            -Dorg.gradle.jvmargs='-Xmx3g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8' \
            -PreactNativeArchitectures=arm64-v8a,x86_64 \
            assembleRelease

      - name: Upload Android preview APK
        uses: actions/upload-artifact@v4
        with:
          name: eo-android-test-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 1

  ios_simulator_preview:
    if: github.event_name == 'push' || inputs.platform == 'ios'
    name: Preview iOS Simulator
    concurrency:
      group: eo-native-preview-${{ github.ref }}-ios
      cancel-in-progress: true
    runs-on: macos-26
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Expo iOS project
        env:
          CI: '1'
        run: npx expo prebuild --clean --platform ios

      - name: Compile iOS Simulator app
        run: |
          workspace="$(find ios -maxdepth 1 -type d -name '*.xcworkspace' -print -quit)"
          if [ -z "$workspace" ]; then
            echo "Expo did not generate the iOS workspace."
            exit 1
          fi
          project="$(find ios -maxdepth 1 -type d -name '*.xcodeproj' -print -quit)"
          app_scheme="$(basename "$project" .xcodeproj)"
          scheme="$(xcodebuild -list -json -workspace "$workspace" | jq -r --arg app_scheme "$app_scheme" '.workspace.schemes[] | select(. == $app_scheme)' | head -n 1)"
          if [ -z "$scheme" ] || [ "$scheme" = "null" ]; then
            echo "Could not identify the app scheme."
            exit 1
          fi
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/eo-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            build
          app_path="$(find "$RUNNER_TEMP/eo-derived-data/Build/Products/Release-iphonesimulator" -maxdepth 2 -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "The iOS Simulator app was not found."
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$RUNNER_TEMP/eo-ios-simulator.zip"

      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: eo-ios-simulator-preview
          path: ${{ runner.temp }}/eo-ios-simulator.zip
          if-no-files-found: error
          retention-days: 1

  ios_testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'ios-testflight'
    name: Build and upload iOS to TestFlight
    concurrency:
      group: eo-testflight-${{ github.ref }}
      cancel-in-progress: false
    runs-on: macos-26
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Apple signing credentials
        shell: bash
        run: |
          for name in APPLE_TEAM_ID ASC_API_KEY_ID ASC_API_ISSUER_ID ASC_API_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Use a unique Apple build number
        run: |
          node -e 'const fs = require("fs"); const p = "app.json"; const config = JSON.parse(fs.readFileSync(p, "utf8")); config.expo.ios.buildNumber = String(1000 + Number(process.env.GITHUB_RUN_NUMBER) * 100 + Number(process.env.GITHUB_RUN_ATTEMPT)); fs.writeFileSync(p, JSON.stringify(config, null, 2) + "\n"); console.log("iOS build:", config.expo.ios.buildNumber);'

      - name: Generate Expo iOS project
        env:
          CI: '1'
        run: npx expo prebuild --clean --platform ios

      - name: Prepare App Store Connect API key
        shell: bash
        run: |
          key_dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$key_dir"
          key_path="$key_dir/AuthKey_${ASC_API_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "ASC_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Enable EO Push Notifications capability for automatic signing
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const xcode = require('xcode');
          const projectDir = fs.readdirSync('ios').find(name => name.endsWith('.xcodeproj'));
          if (!projectDir) throw new Error('Projeto iOS do EO não encontrado.');
          const projectPath = `ios/${projectDir}/project.pbxproj`;
          const project = xcode.project(projectPath);
          project.parseSync();
          const target = project.getFirstTarget();
          const attributes = project.getFirstProject().firstProject.attributes;
          attributes.TargetAttributes ||= {};
          attributes.TargetAttributes[target.uuid] ||= {};
          attributes.TargetAttributes[target.uuid].SystemCapabilities ||= {};
          attributes.TargetAttributes[target.uuid].SystemCapabilities['com.apple.Push'] = { enabled: 1 };
          fs.writeFileSync(projectPath, project.writeSync());
          console.log('Push Notifications ativado no target do EO; Xcode atualizará o provisionamento automaticamente.');
          NODE

      - name: Archive, sign, export, and upload EO to TestFlight
        shell: bash
        run: |
          workspace="$(find ios -maxdepth 1 -type d -name '*.xcworkspace' -print -quit)"
          project="$(find ios -maxdepth 1 -type d -name '*.xcodeproj' -print -quit)"
          if [ -z "$workspace" ] || [ -z "$project" ]; then
            echo "Expo did not generate the iOS app workspace and project."
            exit 1
          fi
          app_scheme="$(basename "$project" .xcodeproj)"
          schemes="$(xcodebuild -list -json -workspace "$workspace" | jq -r '.workspace.schemes[]')"
          if ! printf '%s\n' "$schemes" | grep -Fxq "$app_scheme"; then
            echo "The EO app scheme was not found in the generated iOS workspace."
            exit 1
          fi
          archive_path="$RUNNER_TEMP/EO.xcarchive"
          export_path="$RUNNER_TEMP/EO-export"
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$export_options" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$app_scheme" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_API_KEY_PATH" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY="" \
            archive
          archive_app="$(find "$archive_path/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$archive_app" ]; then
            echo "::error::O aplicativo assinado do EO não foi encontrado no archive."
            exit 1
          fi
          signed_entitlements="$RUNNER_TEMP/EO-signed-entitlements.plist"
          codesign --display --entitlements :- "$archive_app" > "$signed_entitlements"
          aps_environment="$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$signed_entitlements" 2>/dev/null || true)"
          case "$aps_environment" in
            development|production) echo "Archive EO com entitlement APNs: $aps_environment" ;;
            *) echo "::error::A assinatura do EO não contém aps-environment válido. Confira Push Notifications no App ID com.appeo.mobile e a permissão da chave Apple para atualizar o provisionamento. Upload cancelado."; exit 1 ;;
          esac
          profile_plist="$RUNNER_TEMP/EO-provisioning-profile.plist"
          security cms -D -i "$archive_app/embedded.mobileprovision" > "$profile_plist"
          profile_aps="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$profile_plist" 2>/dev/null || true)"
          if [ "$profile_aps" != "$aps_environment" ]; then
            echo "::error::O perfil do EO não autoriza o entitlement APNs da assinatura. Atualize o provisionamento do App ID com.appeo.mobile. Upload cancelado."
            exit 1
          fi
          xcodebuild \
            -exportArchive \
            -archivePath "$archive_path" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$export_options" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_API_KEY_PATH" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID"
          echo "Upload concluido pelo xcodebuild via App Store Connect."
