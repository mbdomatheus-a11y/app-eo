name: EO | Compilar app no GitHub

on:
  push:
    tags:
      - "eo-ios-*"
  workflow_dispatch:
    inputs:
      platform:
        description: Plataforma para gerar pre-visualizacao
        type: choice
        options:
          - android
          - android-play
          - ios
          - ios-testflight
        required: true

permissions:
  contents: read

jobs:
  android_preview:
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'android'
    name: Preview Android
    concurrency:
      group: eo-native-preview-${{ github.ref }}-android
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Expo Android project
        env:
          CI: '1'
        run: npx expo prebuild --clean --platform android

      - name: Compile Android installable release APK with embedded JavaScript
        run: |
          cd android
          chmod +x gradlew
          ./gradlew \
            --no-daemon \
            --max-workers=2 \
            -Dorg.gradle.jvmargs='-Xmx3g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8' \
            -PreactNativeArchitectures=arm64-v8a,x86_64 \
            assembleRelease

      - name: Upload Android preview APK
        uses: actions/upload-artifact@v4
        with:
          name: eo-android-test-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 1

  android_play:
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'android-play'
    name: Android para a Play (AAB assinado)
    concurrency:
      group: eo-android-play-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
      ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Conferir segredos obrigatorios
        run: |
          faltando=""
          for v in ANDROID_UPLOAD_KEYSTORE_B64 ANDROID_UPLOAD_KEYSTORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD; do
            [ -n "${!v}" ] || faltando="$faltando $v"
          done
          if [ -n "$faltando" ]; then echo "::error::Segredos ausentes no GitHub:$faltando (ver docs/ANDROID-PLAY.md)"; exit 1; fi
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then echo "::warning::Sem GOOGLE_SERVICES_JSON_B64: o app sai sem push no Android ate o Firebase ser configurado."; fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked dependencies
        run: npm ci

      - name: Firebase e numero da versao Android
        run: |
          firebase=""
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > google-services.json; firebase="1"; fi
          code=$((1000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          cp app.json app.json.versionado
          node -e "const f='app.json';const a=JSON.parse(require('fs').readFileSync(f));a.expo.android=a.expo.android||{};if(process.argv[2])a.expo.android.googleServicesFile='./google-services.json';a.expo.android.versionCode=Number(process.argv[1]);require('fs').writeFileSync(f,JSON.stringify(a,null,2))" "$code" "$firebase"
          echo "versionCode $code"

      - name: Generate Expo Android project
        env:
          CI: '1'
        run: npx expo prebuild --clean --platform android

      - name: Restaurar app.json versionado (preserva fingerprint OTA)
        run: mv app.json.versionado app.json

      - name: Assinatura de upload
        run: |
          echo "$ANDROID_UPLOAD_KEYSTORE_B64" | base64 -d > android/app/eo-upload.keystore
          node - <<'EOF'
          const fs = require('fs');
          const f = 'android/app/build.gradle';
          let g = fs.readFileSync(f, 'utf8');
          const release = `
                  release {
                      storeFile file('eo-upload.keystore')
                      storePassword System.getenv('ANDROID_UPLOAD_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_UPLOAD_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_UPLOAD_KEY_PASSWORD')
                  }`;
          if (!/signingConfigs\s*\{/.test(g)) throw new Error('signingConfigs nao encontrado');
          g = g.replace(/signingConfigs\s*\{/, (m) => m + release);
          const bt = g.indexOf('buildTypes');
          const rel = g.indexOf('release {', bt);
          const fim = g.indexOf('signingConfig signingConfigs.debug', rel);
          if (bt < 0 || rel < 0 || fim < 0) throw new Error('buildTypes.release nao encontrado');
          g = g.slice(0, fim) + 'signingConfig signingConfigs.release' + g.slice(fim + 'signingConfig signingConfigs.debug'.length);
          fs.writeFileSync(f, g);
          EOF

      - name: Compilar AAB assinado
        run: |
          cd android
          chmod +x gradlew
          ./gradlew \
            --no-daemon \
            --max-workers=2 \
            -Dorg.gradle.jvmargs='-Xmx3g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8' \
            bundleRelease
          rm -f app/eo-upload.keystore

      - name: Guardar AAB
        uses: actions/upload-artifact@v4
        with:
          name: eo-android-aab-${{ env.VERSION_CODE }}
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Enviar ao teste interno da Play
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.appeo.mobile
          releaseFiles: mobile/android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed

  ios_simulator_preview:
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'ios'
    name: Preview iOS Simulator
    concurrency:
      group: eo-native-preview-${{ github.ref }}-ios
      cancel-in-progress: true
    runs-on: macos-26
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Expo iOS project
        env:
          CI: '1'
        run: npx expo prebuild --clean --platform ios

      - name: Compile iOS Simulator app
        run: |
          workspace="$(find ios -maxdepth 1 -type d -name '*.xcworkspace' -print -quit)"
          if [ -z "$workspace" ]; then
            echo "Expo did not generate the iOS workspace."
            exit 1
          fi
          project="$(find ios -maxdepth 1 -type d -name '*.xcodeproj' -print -quit)"
          app_scheme="$(basename "$project" .xcodeproj)"
          scheme="$(xcodebuild -list -json -workspace "$workspace" | jq -r --arg app_scheme "$app_scheme" '.workspace.schemes[] | select(. == $app_scheme)' | head -n 1)"
          if [ -z "$scheme" ] || [ "$scheme" = "null" ]; then
            echo "Could not identify the app scheme."
            exit 1
          fi
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/eo-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            build
          app_path="$(find "$RUNNER_TEMP/eo-derived-data/Build/Products/Release-iphonesimulator" -maxdepth 2 -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "The iOS Simulator app was not found."
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$RUNNER_TEMP/eo-ios-simulator.zip"

      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: eo-ios-simulator-preview
          path: ${{ runner.temp }}/eo-ios-simulator.zip
          if-no-files-found: error
          retention-days: 1

  ios_testflight:
    if: (github.event_name == 'workflow_dispatch' && inputs.platform == 'ios-testflight') || startsWith(github.ref, 'refs/tags/eo-ios-')
    name: Build and upload iOS to TestFlight
    concurrency:
      group: eo-testflight-${{ github.ref }}
      cancel-in-progress: false
    runs-on: macos-26
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Apple signing credentials
        shell: bash
        run: |
          for name in APPLE_TEAM_ID ASC_API_KEY_ID ASC_API_ISSUER_ID ASC_API_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Test signing configuration checks
        run: python3 ../scripts/test-ios-signing-inputs.py

      - name: Use a unique Apple build number
        run: |
          node -e 'const fs = require("fs"); const p = "app.json"; const config = JSON.parse(fs.readFileSync(p, "utf8")); config.expo.ios.buildNumber = String(1000 + Number(process.env.GITHUB_RUN_NUMBER) * 100 + Number(process.env.GITHUB_RUN_ATTEMPT)); fs.writeFileSync(p, JSON.stringify(config, null, 2) + "\n"); console.log("iOS build:", config.expo.ios.buildNumber);'

      - name: Generate Expo iOS project
        env:
          CI: '1'
        run: npx expo prebuild --clean --platform ios

      - name: Preserve native build number without changing OTA compatibility
        shell: bash
        run: |
          # O número único já foi escrito no projeto/Info.plist pelo prebuild.
          # O fingerprint usa o app.json estável do repositório, igual ao EAS Update.
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          fs.writeFileSync('app.json', execFileSync('git', ['show', 'HEAD:mobile/app.json']));
          NODE
          info_plist="$(find ios -mindepth 2 -maxdepth 2 -name Info.plist -not -path '*/Pods/*' -print -quit)"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info_plist"

      - name: Prepare App Store Connect API key
        shell: bash
        run: |
          key_dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$key_dir"
          key_path="$key_dir/AuthKey_${ASC_API_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "ASC_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Confirm EO Push capability in Apple Developer
        run: node ../scripts/ios-ensure-push.mjs

      - name: Enable EO Push Notifications capability for automatic signing
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const xcode = require('xcode');
          const projectDir = fs.readdirSync('ios').find(name => name.endsWith('.xcodeproj'));
          if (!projectDir) throw new Error('Projeto iOS do EO não encontrado.');
          const projectPath = `ios/${projectDir}/project.pbxproj`;
          const project = xcode.project(projectPath);
          project.parseSync();
          const target = project.getFirstTarget();
          const attributes = project.getFirstProject().firstProject.attributes;
          attributes.TargetAttributes ||= {};
          attributes.TargetAttributes[target.uuid] ||= {};
          attributes.TargetAttributes[target.uuid].SystemCapabilities ||= {};
          attributes.TargetAttributes[target.uuid].SystemCapabilities['com.apple.Push'] = { enabled: 1 };
          fs.writeFileSync(projectPath, project.writeSync());
          console.log('Push Notifications ativado no target do EO; Xcode atualizará o provisionamento automaticamente.');
          NODE

      - name: Archive, sign, export, and upload EO to TestFlight
        shell: bash
        run: |
          workspace="$(find ios -maxdepth 1 -type d -name '*.xcworkspace' -print -quit)"
          project="$(find ios -maxdepth 1 -type d -name '*.xcodeproj' -print -quit)"
          if [ -z "$workspace" ] || [ -z "$project" ]; then
            echo "Expo did not generate the iOS app workspace and project."
            exit 1
          fi
          app_scheme="$(basename "$project" .xcodeproj)"
          schemes="$(xcodebuild -list -json -workspace "$workspace" | jq -r '.workspace.schemes[]')"
          if ! printf '%s\n' "$schemes" | grep -Fxq "$app_scheme"; then
            echo "The EO app scheme was not found in the generated iOS workspace."
            exit 1
          fi
          archive_path="$RUNNER_TEMP/EO.xcarchive"
          export_path="$RUNNER_TEMP/EO-export"
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$export_options" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          source_entitlements="$(find ios -maxdepth 3 -name '*.entitlements' -not -path '*/Pods/*' -print -quit)"
          test -n "$source_entitlements"
          bash ../scripts/ios-signing-preflight.sh "$export_options" "$source_entitlements"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$app_scheme" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_API_KEY_PATH" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="" \
            archive
          unsigned_app="$(find "$archive_path/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$unsigned_app"
          bash ../scripts/ios-preserve-entitlements.sh "$unsigned_app" "$source_entitlements" "$RUNNER_TEMP/EO-target-entitlements.plist"
          xcodebuild \
            -exportArchive \
            -archivePath "$archive_path" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$export_options" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_API_KEY_PATH" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID"
          ipa_path="$(find "$export_path" -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "$ipa_path" ]; then
            echo "::error::A exportação não gerou o IPA assinado do EO."
            exit 1
          fi
          unzip -q "$ipa_path" -d "$RUNNER_TEMP/EO-verify"
          archive_app="$(find "$RUNNER_TEMP/EO-verify/Payload" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$archive_app" ]; then
            echo "::error::O aplicativo assinado do EO não foi encontrado no IPA final."
            exit 1
          fi
          signed_entitlements="$RUNNER_TEMP/EO-signed-entitlements.plist"
          codesign --display --entitlements - --xml "$archive_app" > "$signed_entitlements"
          aps_environment="$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$signed_entitlements" 2>/dev/null || true)"
          case "$aps_environment" in
            production) echo "IPA EO com entitlement APNs: $aps_environment" ;;
            *) echo "::error::A assinatura do EO não contém aps-environment válido. Confira Push Notifications no App ID com.appeo.mobile e a permissão da chave Apple para atualizar o provisionamento. Upload cancelado."; exit 1 ;;
          esac
          profile_plist="$RUNNER_TEMP/EO-provisioning-profile.plist"
          security cms -D -i "$archive_app/embedded.mobileprovision" > "$profile_plist"
          profile_aps="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$profile_plist" 2>/dev/null || true)"
          if [ "$profile_aps" != "$aps_environment" ]; then
            echo "::error::O perfil do EO não autoriza o entitlement APNs da assinatura. Atualize o provisionamento do App ID com.appeo.mobile. Upload cancelado."
            exit 1
          fi
          codesign --verify --deep --strict "$archive_app"
          xcrun altool --upload-app --type ios --file "$ipa_path" \
            --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID"
          echo "IPA EO validado com APNs production e enviado ao App Store Connect."
