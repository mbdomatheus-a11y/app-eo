name: Verificar App EO
on:
  push:
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "tsconfig*.json"
      - "capacitor.config.*"
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "tsconfig*.json"
      - "capacitor.config.*"
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Testes da raiz importam arquivos de mobile/, cujo tsconfig estende o do Expo.
      - run: npm ci --prefix mobile --ignore-scripts --legacy-peer-deps
      - run: npm test
      - run: npm run build
      # Tipos do app mobile (19/11/2026). Informativo até zerar os erros antigos; depois passa a bloquear.
      - name: Tipos do app mobile
        continue-on-error: true
        working-directory: mobile
        run: npx tsc --noEmit
