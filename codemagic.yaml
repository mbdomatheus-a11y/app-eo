workflows:
  android-debug:
    name: App EO Android (debug)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22.11.0
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Sync Android project
        script: npx cap sync android
      - name: Build Android debug APK
        script: cd android && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

  ios-simulator:
    name: App EO iOS (simulator)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22.11.0
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Sync iOS project
        script: npx cap sync ios
      - name: Build iOS simulator app
        script: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator
          -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/ios/Build/Products/Debug-iphonesimulator/App.app/**

  android-release-candidate:
    name: App EO Android (AAB assinado, sem publicação)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22.11.0
      android_signing:
        - app_eo_android_upload
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Sync Android project
        script: npx cap sync android
      - name: Build signed Android App Bundle
        script: cd android && ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab

  ios-release-candidate:
    name: App EO iOS (IPA assinado, sem publicação)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22.11.0
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.appeo.mobile
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Sync iOS project
        script: npx cap sync ios
      - name: Apply Apple signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
